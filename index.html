<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลการรับสมัคร TCAS</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', 'Tahoma', system-ui, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
      color: #fff;
      padding: 20px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.45rem; font-weight: 600; letter-spacing: .01em; }
    header p  { font-size: .9rem; opacity: .72; margin-top: 3px; }

    /* ── Search bar ── */
    .search-bar {
      background: #fff;
      padding: 14px 28px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #dde1e7;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .search-bar input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 9px 14px;
      border: 1.5px solid #c5cae9;
      border-radius: 7px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .search-bar input[type="text"]:focus { border-color: #3949ab; }
    .search-bar select {
      padding: 9px 12px;
      border: 1.5px solid #c5cae9;
      border-radius: 7px;
      font-family: inherit;
      font-size: 1rem;
      background: #fff;
      outline: none;
      cursor: pointer;
    }
    .btn-search {
      padding: 9px 22px;
      background: #1a237e;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-search:hover { background: #283593; }

    /* ── Stats bar ── */
    .stats {
      padding: 10px 28px;
      font-size: .88rem;
      color: #666;
      min-height: 34px;
    }

    /* ── Table ── */
    .table-wrap {
      padding: 0 28px 28px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,.09);
      font-size: .875rem;
    }
    thead th {
      position: relative;
      background: #e8eaf6;
      color: #1a237e;
      padding: 11px 12px;
      text-align: left;
      white-space: nowrap;
      font-weight: 600;
      border-bottom: 2px solid #c5cae9;
      user-select: none;
    }
    .resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      z-index: 1;
    }
    .resizer:hover,
    .resizer.resizing {
      background: rgba(63, 81, 181, 0.45);
    }

    /* ── Column filter row ── */
    #thead-filter td {
      background: #eef0f8;
      padding: 5px 8px;
      border-bottom: 2px solid #c5cae9;
    }
    .col-filter {
      width: 100%;
      padding: 4px 7px;
      border: 1.5px solid #c5cae9;
      border-radius: 4px;
      font-family: inherit;
      font-size: .8rem;
      outline: none;
      background: #fff;
      transition: border-color .2s;
      box-sizing: border-box;
    }
    .col-filter:focus { border-color: #3949ab; }
    .col-filter.active {
      border-color: #3949ab;
      background: #e8eaf6;
    }
    .num-filter { text-align: right; }
    .btn-clear-cf {
      background: transparent;
      border: 1.5px solid #c5cae9;
      border-radius: 4px;
      color: #777;
      font-size: .8rem;
      cursor: pointer;
      padding: 3px 8px;
      font-family: inherit;
      transition: background .15s;
    }
    .btn-clear-cf:hover { background: #e8eaf6; color: #1a237e; border-color: #9fa8da; }

    thead th.num { text-align: right; }
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { background: #d1d5f0; }
    thead th.sort-asc::after  { content: " ▲"; font-size: .75em; opacity: .8; }
    thead th.sort-desc::after { content: " ▼"; font-size: .75em; opacity: .8; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: #f3f4fc; }
    tbody tr:last-child td { border-bottom: none; }
    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #eef0f6;
      vertical-align: middle;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tbody td.num  { text-align: right; max-width: none; white-space: nowrap; }
    tbody td.year { text-align: center; max-width: none; white-space: nowrap; }

    /* year badges */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: .8rem;
      font-weight: 600;
    }
    .badge-68 { background: #e3f2fd; color: #1565c0; }
    .badge-69 { background: #f3e5f5; color: #6a1b9a; }

    /* null / missing */
    .dim { color: #bbb; }

    /* score highlight */
    .score-high { color: #2e7d32; font-weight: 600; }
    .score-low  { color: #b71c1c; font-weight: 600; }

    /* ── Aggregate footer ── */
    #tfoot-agg td {
      padding: 6px 12px;
      background: #f0f2fc;
      font-size: .8rem;
      border-top: none;
      border-bottom: 1px solid #e0e3f5;
    }
    #tfoot-agg tr:first-child td { border-top: 2px solid #9fa8da; }
    #tfoot-agg tr:last-child  td { border-bottom: none; }
    .agg-label {
      text-align: right;
      color: #5c6bc0;
      font-weight: 600;
      font-size: .75rem;
      letter-spacing: .03em;
    }
    .agg-val { color: #333; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      gap: 5px;
      padding: 14px 28px 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .pagination button {
      min-width: 36px;
      padding: 6px 10px;
      border: 1.5px solid #c5cae9;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      color: #333;
      transition: background .15s, border-color .15s;
    }
    .pagination button.active {
      background: #1a237e;
      color: #fff;
      border-color: #1a237e;
    }
    .pagination button:disabled  { opacity: .35; cursor: default; }
    .pagination button:hover:not(:disabled):not(.active) {
      background: #e8eaf6;
      border-color: #9fa8da;
    }
    .pagination .ellipsis { color: #aaa; padding: 0 4px; }

    /* ── State rows ── */
    .state-row td {
      padding: 48px;
      text-align: center;
      color: #aaa;
      font-size: 1rem;
    }

    /* ── Checkbox col ── */
    thead th.cb-col, tbody td.cb-col {
      width: 36px; text-align: center; padding: 9px 6px;
      max-width: none; white-space: nowrap;
    }
    input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: #1a237e; }
    tbody tr.selected { background: #e8eaf6 !important; }

    /* ── Selection bar ── */
    #sel-bar {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a237e;
      color: #fff;
      padding: 12px 22px;
      border-radius: 40px;
      box-shadow: 0 4px 18px rgba(0,0,0,.3);
      align-items: center;
      gap: 14px;
      font-size: .95rem;
      z-index: 100;
      white-space: nowrap;
    }
    #sel-bar.visible { display: flex; }
    #sel-bar .sel-count { font-weight: 600; }
    #btn-compare {
      background: #fff;
      color: #1a237e;
      border: none;
      border-radius: 20px;
      padding: 6px 18px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    #btn-compare:hover { background: #e8eaf6; }
    #btn-clear {
      background: transparent;
      color: rgba(255,255,255,.7);
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    #btn-clear:hover { color: #fff; }

    @media (max-width: 640px) {
      header { padding: 14px 16px; }
      .search-bar { padding: 12px 16px; }
      .stats       { padding: 8px 16px; }
      .table-wrap  { padding: 0 8px 20px; }
      .pagination  { padding: 12px 8px 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>ผลการรับสมัคร TCAS — รอบ 3</h1>
  <p>ข้อมูลปีการศึกษา 2568 และ 2569</p>
</header>

<div class="search-bar">
  <input type="text" id="q"
         placeholder="ค้นหา เช่น: กลุ่มสถาบันแพทย แพทยศาสตร์  (เว้นวรรค = AND)" />
  <select id="year">
    <option value="">ทุกปี</option>
    <option value="2568">2568</option>
    <option value="2569">2569</option>
  </select>
  <button class="btn-search" onclick="search(1)">ค้นหา</button>
</div>

<div class="stats" id="stats"></div>

<div id="sel-bar">
  <span class="sel-count"><span id="sel-count-num">0</span> รายการที่เลือก</span>
  <button id="btn-compare" onclick="openCompare()">เปรียบเทียบ 2568 vs 2569 ▶</button>
  <button id="btn-clear" onclick="clearSelection()" title="ยกเลิกการเลือก">✕</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="cb-col"><input type="checkbox" id="chk-all" title="เลือกทั้งหมดในหน้านี้" onchange="toggleAll(this)"></th>
        <th class="sortable" data-sort="year">ปี</th>
        <th class="sortable" data-sort="สถาบัน">สถาบัน</th>
        <th class="sortable" data-sort="วิทยาเขต">วิทยาเขต</th>
        <th class="sortable" data-sort="คณะ">คณะ</th>
        <th class="sortable" data-sort="หลักสูตร">หลักสูตร</th>
        <th class="sortable" data-sort="สาขา/วิชาเอก">สาขา / วิชาเอก</th>
        <th class="num sortable" data-sort="รับ">รับ</th>
        <th class="num sortable" data-sort="สมัคร">สมัคร</th>
        <th class="num sortable" data-sort="ผ่าน">ผ่าน</th>
        <th class="num sortable" data-sort="คะแนนสูงสุด">คะแนนสูงสุด</th>
        <th class="num sortable" data-sort="คะแนนต่ำสุด">คะแนนต่ำสุด</th>
      </tr>
      <tr id="thead-filter">
        <td class="cb-col"><button class="btn-clear-cf" onclick="clearColFilters()" title="ล้างตัวกรองทั้งหมด">✕</button></td>
        <td></td>
        <td><input class="col-filter" data-col="สถาบัน"       data-col-idx="0" placeholder="กรอง…" /></td>
        <td><input class="col-filter" data-col="วิทยาเขต"     data-col-idx="1" placeholder="กรอง…" /></td>
        <td><input class="col-filter" data-col="คณะ"          data-col-idx="2" placeholder="กรอง…" /></td>
        <td><input class="col-filter" data-col="หลักสูตร"     data-col-idx="3" placeholder="กรอง…" /></td>
        <td><input class="col-filter" data-col="สาขา/วิชาเอก" data-col-idx="4" placeholder="กรอง…" /></td>
        <td><input class="col-filter num-filter" data-col="รับ"          data-col-idx="5" placeholder="≥50 / ≤100" /></td>
        <td><input class="col-filter num-filter" data-col="สมัคร"        data-col-idx="6" placeholder="≥50 / ≤100" /></td>
        <td><input class="col-filter num-filter" data-col="ผ่าน"         data-col-idx="7" placeholder="≥50 / ≤100" /></td>
        <td><input class="col-filter num-filter" data-col="คะแนนสูงสุด"  data-col-idx="8" placeholder="≥50 / ≤100" /></td>
        <td><input class="col-filter num-filter" data-col="คะแนนต่ำสุด"  data-col-idx="9" placeholder="≥50 / ≤100" /></td>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr class="state-row"><td colspan="12">กำลังโหลด…</td></tr>
    </tbody>
    <tfoot id="tfoot-agg">
      <tr>
        <td colspan="7" class="agg-label">เฉลี่ย</td>
        <td class="num agg-val" data-agg-col="รับ"         data-agg-type="avg">—</td>
        <td class="num agg-val" data-agg-col="สมัคร"       data-agg-type="avg">—</td>
        <td class="num agg-val" data-agg-col="ผ่าน"        data-agg-type="avg">—</td>
        <td class="num agg-val" data-agg-col="คะแนนสูงสุด" data-agg-type="avg">—</td>
        <td class="num agg-val" data-agg-col="คะแนนต่ำสุด" data-agg-type="avg">—</td>
      </tr>
      <tr>
        <td colspan="7" class="agg-label">สูงสุด</td>
        <td class="num agg-val" data-agg-col="รับ"         data-agg-type="max">—</td>
        <td class="num agg-val" data-agg-col="สมัคร"       data-agg-type="max">—</td>
        <td class="num agg-val" data-agg-col="ผ่าน"        data-agg-type="max">—</td>
        <td class="num agg-val" data-agg-col="คะแนนสูงสุด" data-agg-type="max">—</td>
        <td class="num agg-val" data-agg-col="คะแนนต่ำสุด" data-agg-type="max">—</td>
      </tr>
      <tr>
        <td colspan="7" class="agg-label">ต่ำสุด</td>
        <td class="num agg-val" data-agg-col="รับ"         data-agg-type="min">—</td>
        <td class="num agg-val" data-agg-col="สมัคร"       data-agg-type="min">—</td>
        <td class="num agg-val" data-agg-col="ผ่าน"        data-agg-type="min">—</td>
        <td class="num agg-val" data-agg-col="คะแนนสูงสุด" data-agg-type="min">—</td>
        <td class="num agg-val" data-agg-col="คะแนนต่ำสุด" data-agg-type="min">—</td>
      </tr>
    </tfoot>
  </table>
</div>

<div class="pagination" id="pagination"></div>

<script>
  const PER_PAGE = 50;
  let debounceTimer;
  let sortCol = "";
  let sortDir = "asc";

  document.getElementById("q").addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => search(1), 380);
  });
  document.getElementById("q").addEventListener("keydown", e => {
    if (e.key === "Enter") { clearTimeout(debounceTimer); search(1); }
  });
  document.getElementById("year").addEventListener("change", () => search(1));

  document.querySelectorAll("thead th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.sort;
      if (sortCol === col) {
        sortDir = sortDir === "asc" ? "desc" : "asc";
      } else {
        sortCol = col;
        sortDir = "asc";
      }
      updateSortHeaders();
      search(1);
    });
  });

  // ── Column filter inputs ────────────────────────────────────────────────────
  let colFilterTimer;
  document.querySelectorAll('.col-filter').forEach(inp => {
    inp.addEventListener('input', () => {
      clearTimeout(colFilterTimer);
      inp.classList.toggle('active', inp.value.trim() !== '');
      colFilterTimer = setTimeout(() => search(1), 400);
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { clearTimeout(colFilterTimer); search(1); }
    });
  });

  function clearColFilters() {
    document.querySelectorAll('.col-filter').forEach(inp => {
      inp.value = '';
      inp.classList.remove('active');
    });
    search(1);
  }

  function updateSortHeaders() {
    document.querySelectorAll("thead th.sortable").forEach(th => {
      th.classList.remove("sort-asc", "sort-desc");
      if (th.dataset.sort === sortCol) {
        th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
      }
    });
  }

  // ── fetch & render ──────────────────────────────────────────────────────────
  async function search(page) {
    const q    = document.getElementById("q").value.trim();
    const year = document.getElementById("year").value;
    let url  = `/api/search?q=${encodeURIComponent(q)}&year=${encodeURIComponent(year)}&page=${page}&per_page=${PER_PAGE}`;
    if (sortCol) url += `&sort=${encodeURIComponent(sortCol)}&dir=${sortDir}`;
    document.querySelectorAll('.col-filter').forEach(inp => {
      const val = inp.value.trim();
      if (val) url += `&cf${inp.dataset.colIdx}=${encodeURIComponent(val)}`;
    });

    setLoading();

    try {
      const res  = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderTable(data.rows);
      renderPagination(data.total, page);
      renderStats(data.total, page, data.rows.length);
      renderAggregates(data.aggregates);
    } catch (err) {
      document.getElementById("tbody").innerHTML =
        `<tr class="state-row"><td colspan="12">เกิดข้อผิดพลาด: ${esc(err.message)}</td></tr>`;
      document.getElementById("stats").textContent = "";
      document.getElementById("pagination").innerHTML = "";
    }
  }

  function setLoading() {
    document.getElementById("tbody").innerHTML =
      `<tr class="state-row"><td colspan="12">กำลังค้นหา…</td></tr>`;
    document.getElementById("stats").textContent = "";
    document.getElementById("pagination").innerHTML = "";
  }

  // ── selection state ─────────────────────────────────────────────────────────
  const selected = new Set(); // stores รหัสหลักสูตร values

  function updateSelBar() {
    const bar = document.getElementById("sel-bar");
    document.getElementById("sel-count-num").textContent = selected.size;
    bar.classList.toggle("visible", selected.size > 0);
  }

  function toggleRow(code, checked, tr) {
    if (checked) selected.add(code); else selected.delete(code);
    tr.classList.toggle("selected", checked);
    updateSelBar();
  }

  function toggleAll(chk) {
    document.querySelectorAll("tbody input[type=checkbox]").forEach(cb => {
      if (cb.checked !== chk.checked) cb.click();
    });
  }

  function clearSelection() {
    selected.clear();
    document.querySelectorAll("tbody input[type=checkbox]").forEach(cb => {
      cb.checked = false;
      cb.closest("tr").classList.remove("selected");
    });
    const ca = document.getElementById("chk-all");
    if (ca) ca.checked = false;
    updateSelBar();
  }

  function openCompare() {
    if (!selected.size) return;
    const codes = [...selected].join(",");
    window.location.href = `/compare?codes=${encodeURIComponent(codes)}`;
  }

  // ── table ───────────────────────────────────────────────────────────────────
  function renderTable(rows) {
    const tbody = document.getElementById("tbody");
    if (!rows.length) {
      tbody.innerHTML = `<tr class="state-row"><td colspan="12">ไม่พบข้อมูลที่ตรงกับการค้นหา</td></tr>`;
      return;
    }
    // Restore check-all state
    const ca = document.getElementById("chk-all");
    if (ca) ca.checked = false;

    tbody.innerHTML = rows.map(r => {
      const code  = esc(r["รหัสหลักสูตร"] || "");
      const year  = r["year"];
      const isSel = selected.has(r["รหัสหลักสูตร"]);
      const badge = year === 2568
        ? `<span class="badge badge-68">2568</span>`
        : `<span class="badge badge-69">2569</span>`;
      return `<tr class="${isSel ? 'selected' : ''}" data-code="${code}">
        <td class="cb-col"><input type="checkbox" ${isSel ? 'checked' : ''}
          onchange="toggleRow('${code}', this.checked, this.closest('tr'))"></td>
        <td class="year">${badge}</td>
        <td title="${esc(r["สถาบัน"])}">${txt(r["สถาบัน"])}</td>
        <td title="${esc(r["วิทยาเขต"])}">${txt(r["วิทยาเขต"])}</td>
        <td title="${esc(r["คณะ"])}">${txt(r["คณะ"])}</td>
        <td title="${esc(r["หลักสูตร"])}">${txt(r["หลักสูตร"])}</td>
        <td title="${esc(r["สาขา/วิชาเอก"])}">${txt(r["สาขา/วิชาเอก"])}</td>
        <td class="num">${num(r["รับ"])}</td>
        <td class="num">${num(r["สมัคร"])}</td>
        <td class="num">${num(r["ผ่าน"])}</td>
        <td class="num score-high">${score(r["คะแนนสูงสุด"])}</td>
        <td class="num score-low">${score(r["คะแนนต่ำสุด"])}</td>
      </tr>`;
    }).join("");
  }

  // ── pagination ──────────────────────────────────────────────────────────────
  function renderPagination(total, page) {
    const totalPages = Math.ceil(total / PER_PAGE);
    const el = document.getElementById("pagination");
    if (totalPages <= 1) { el.innerHTML = ""; return; }

    const WINDOW = 2;
    const s = Math.max(1, page - WINDOW);
    const e = Math.min(totalPages, page + WINDOW);

    let html = btn("‹", page - 1, page === 1);

    if (s > 1)               html += btn("1", 1);
    if (s > 2)               html += `<span class="ellipsis">…</span>`;
    for (let p = s; p <= e; p++) html += btn(p, p, false, p === page);
    if (e < totalPages - 1)  html += `<span class="ellipsis">…</span>`;
    if (e < totalPages)      html += btn(totalPages, totalPages);

    html += btn("›", page + 1, page === totalPages);
    el.innerHTML = html;
  }

  function btn(label, page, disabled = false, active = false) {
    const cls = active ? " active" : "";
    return `<button class="${cls}" ${disabled ? "disabled" : ""} onclick="search(${page})">${label}</button>`;
  }

  // ── stats ───────────────────────────────────────────────────────────────────
  function renderStats(total, page, count) {
    const start = (page - 1) * PER_PAGE + 1;
    const end   = start + count - 1;
    document.getElementById("stats").textContent = total > 0
      ? `พบ ${total.toLocaleString()} รายการ  ·  แสดง ${start.toLocaleString()}–${end.toLocaleString()}`
      : "ไม่พบข้อมูล";
  }

  // ── aggregates ──────────────────────────────────────────────────────────────
  function renderAggregates(agg) {
    document.querySelectorAll('.agg-val').forEach(cell => {
      const col  = cell.dataset.aggCol;
      const type = cell.dataset.aggType;
      const val  = agg?.[col]?.[type];
      if (val == null) { cell.textContent = '—'; return; }
      cell.textContent = type === 'avg'
        ? Number(val).toFixed(2)
        : Number(val).toLocaleString();
    });
  }

  // ── formatters ──────────────────────────────────────────────────────────────
  function esc(v)   { return v == null ? "" : String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function txt(v)   { return v == null || v === "" ? `<span class="dim">—</span>` : esc(v); }
  function num(v)   { return v == null ? `<span class="dim">—</span>` : Number(v).toLocaleString(); }
  function score(v) { return v == null ? `<span class="dim">—</span>` : Number(v).toFixed(2); }

  // ── Column resizing ─────────────────────────────────────────────────────────
  function initColumnResizers() {
    document.querySelectorAll('thead th').forEach(th => {
      const resizer = document.createElement('div');
      resizer.classList.add('resizer');
      th.appendChild(resizer);

      // Prevent resizer clicks from triggering column sort
      resizer.addEventListener('click', e => e.stopPropagation());

      resizer.addEventListener('mousedown', e => {
        e.preventDefault();

        // On first resize, lock column widths and switch to fixed layout
        const table = th.closest('table');
        if (table.style.tableLayout !== 'fixed') {
          document.querySelectorAll('thead th').forEach(h => {
            h.style.width = h.offsetWidth + 'px';
          });
          table.style.tableLayout = 'fixed';
          table.style.width = table.offsetWidth + 'px';
        }

        const startX = e.pageX;
        const startW = th.offsetWidth;
        document.body.style.cursor = 'col-resize';
        resizer.classList.add('resizing');

        function onMove(e) {
          th.style.width = Math.max(40, startW + e.pageX - startX) + 'px';
        }
        function onUp() {
          document.body.style.cursor = '';
          resizer.classList.remove('resizing');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  initColumnResizers();

  // Initial load
  search(1);
</script>
</body>
</html>
